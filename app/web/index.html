<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>app Support Bot</title>

    /static/style.css
</head>

<body>
    <main class="chat-container">
        <header class="chat-header">
            <h1>app Support Bot</h1>

            <p>
                Ask questions about KPI creation,
                datasources, imports and troubleshooting.
            </p>
        </header>

        <section class="suggestions">
            <button
                class="suggestion"
                data-question="How do I create a KPI report?"
            >
                Create KPI report
            </button>

            <button
                class="suggestion"
                data-question="How do I enable Custom Logic Builder?"
            >
                Enable Custom Logic Builder
            </button>

            <button
                class="suggestion"
                data-question="How do I import datasource data?"
            >
                Import datasource data
            </button>
        </section>

        <section
            id="messages"
            class="messages"
            aria-live="polite"
        >
            <div class="message assistant">
                Hello. How can I help with the application?
            </div>
        </section>

        <p
            id="error-message"
            class="error-message"
        ></p>

        <form id="chat-form" class="chat-form">
            <input
                id="question"
                type="text"
                maxlength="1000"
                placeholder="Ask a app question..."
                autocomplete="off"
                required
            >

            <button
                id="send-button"
                type="submit"
            >
                Send
            </button>
        </form>
    </main>

    /static/app.jsscript>
</body>
</html>
